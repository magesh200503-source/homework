<!doctype html>
<html lang="ru" class="page">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/index.css" />
        <link
            rel="shortcut icon"
            href="icons/nike-favicon-48x48.ico"
            type="image/x-icon"
        />
        <script type="module" defer src="js/index.js"></script>
        <title>Nike Air Mag</title>
    </head>
    <body class="page__body">
        <header class="header">
            <div class="container header__container">
                <a href="" class="header__logo logo">
                    <img
                        src="icons/logo-main.svg"
                        width="50"
                        height="20"
                        alt="Логотип Nike"
                        class="logo__image"
                /></a>
                <nav class="header__menu menu" id="header__menu">
                    <ul class="menu__list">
                        <li class="menu-item">
                            <a href="#Air-Mag" class="menu__link">Air Mag</a>
                        </li>
                        <li class="menu-item">
                            <a href="#Size" class="menu__link">Размеры</a>
                        </li>
                        <li class="menu-item">
                            <a href="#characteristics" class="menu__link"
                                >Характеристики</a
                            >
                        </li>
                        <li class="menu-item">
                            <a href="#top-models" class="menu__link"
                                >Другие ТОП модели</a
                            >
                        </li>
                    </ul>
                </nav>
                <div class="header__controls">
                    <a href="#" class="header__order">Сделать заказ</a>
                    <div class="header__actions">
                        <button class="header__actions-button">
                            <svg width="24" height="24">
                                <use
                                    class="header__actions-icon"
                                    href="icons/search-icon.svg#search"
                                ></use>
                            </svg>
                        </button>
                        <button class="header__actions-button">
                            <svg width="24" height="24">
                                <use
                                    class="header__actions-icon"
                                    href="icons/search-icon.svg#cart"
                                ></use>
                            </svg>
                        </button>
                        <button
                            class="header__burger burger"
                            aria-controls="header__menu"
                            aria-expanded="false"
                            aria-label="Открыть меню"
                        >
                            <svg width="24" height="24">
                                <use
                                    class="burger__icon-menu"
                                    href="icons/search-icon.svg#burger"
                                ></use>
                                <use
                                    class="burger__icon-cross"
                                    href="icons/search-icon.svg#cross"
                                ></use>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </header>
    </body>
</html>
